name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # required so the tagged build can create/update the GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Extract bundled CLI
        run: Expand-Archive -Path cli/windows/dwc_win.zip -DestinationPath cli/windows -Force
        shell: pwsh

      - name: Publish (framework-dependent, one folder)
        run: >
          dotnet publish csharp/AsusDisplayControl.csproj
          -c Release -r win-x64 --self-contained false
          -p:DebugType=none -o csharp/publish
        shell: pwsh

      - name: Derive version from tag
        id: ver
        run: |
          $v = "${{ github.ref_name }}" -replace '^v',''
          if (-not $v) { $v = "1.0.0" }
          "version=$v" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} csharp/installer.iss
        shell: pwsh

      - name: Package portable zip
        run: Compress-Archive -Path csharp/publish/* -DestinationPath ASUS-Display-Control-portable.zip -Force
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asus-display-control
          path: |
            csharp/dist/ASUS-Display-Control-Setup.exe
            ASUS-Display-Control-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ASUS Display Control ${{ github.ref_name }}
          body: |
            Native Windows app for controlling ASUS monitors — Splendid presets, color
            controls, system tray, and scheduled preset switching.

            **Downloads**
            - `ASUS-Display-Control-Setup.exe` — installer (Start Menu shortcut, optional
              desktop shortcut and start-with-Windows, uninstaller).
            - `ASUS-Display-Control-portable.zip` — no install; unzip and run
              `ASUS-Display-Control.exe`.

            **Requires** the [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0)
            (Windows will prompt to install it on first run if it is missing) and an ASUS
            monitor with DDC/CI enabled in its OSD.
          files: |
            csharp/dist/ASUS-Display-Control-Setup.exe
            ASUS-Display-Control-portable.zip
